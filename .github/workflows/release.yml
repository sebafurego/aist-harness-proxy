name: Release desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_RUNTIME_VERSION: v22.23.3

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Create the release once (builds upload into it, no duplicate releases)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "AiST ${GITHUB_REF_NAME#v}" --notes "Сборки для macOS (Apple Silicon) и Windows (x64). Приложение обновляется автоматически."

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
            node_dist: darwin-arm64
          - os: windows-latest
            platform: win
            arch: x64
            node_dist: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/runtime/package-lock.json

      - name: Install Harness runtime (platform-specific native modules)
        working-directory: desktop/runtime
        run: npm ci

      - name: Download bundled Node (macOS)
        if: matrix.platform == 'mac'
        working-directory: desktop
        run: |
          mkdir -p node-bin/mac-${{ matrix.arch }}
          curl -sL https://nodejs.org/dist/$NODE_RUNTIME_VERSION/node-$NODE_RUNTIME_VERSION-${{ matrix.node_dist }}.tar.gz -o node.tgz
          tar -xzf node.tgz -C node-bin/mac-${{ matrix.arch }} --strip-components=2 node-$NODE_RUNTIME_VERSION-${{ matrix.node_dist }}/bin/node
          node-bin/mac-${{ matrix.arch }}/node -v

      - name: Download bundled Node (Windows)
        if: matrix.platform == 'win'
        working-directory: desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path node-bin/win-${{ matrix.arch }} | Out-Null
          Invoke-WebRequest "https://nodejs.org/dist/$env:NODE_RUNTIME_VERSION/node-$env:NODE_RUNTIME_VERSION-${{ matrix.node_dist }}.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node-tmp
          Copy-Item "node-tmp/node-$env:NODE_RUNTIME_VERSION-${{ matrix.node_dist }}/node.exe" node-bin/win-${{ matrix.arch }}/node.exe
          & node-bin/win-${{ matrix.arch }}/node.exe -v

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build and publish to GitHub Release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish always

      - uses: actions/upload-artifact@v4
        with:
          name: aist-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.yml
          if-no-files-found: ignore

  pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write latest release info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out && cp -R site/* out/
          gh release view "$GITHUB_REF_NAME" --json tagName,name,publishedAt,body,assets > out/latest.json
          head -c 400 out/latest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
