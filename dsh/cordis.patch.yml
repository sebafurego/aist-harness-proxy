# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1

# BEGIN aist-provider (managed by aist-harness-proxy; edit assistants in Settings → Ассистент)
- id: llm-pi-ai
  config:
    providers:
      aist:
        displayName: AiST
        apiKeyEnv: AIST_PROXY_KEY
        api: anthropic-messages
        baseURL: http://127.0.0.1:3091
        defaultContextWindow: 200000
        defaultMaxTokens: 32768
        retryPolicy:
          mode: normal
          maxRetries: 2
        models:
          - id: aist-87
            name: 'AiST Агент 87'
            input: [text, image]
            contextWindow: 200000

- id: agent-default-model
  config:
    provider: aist
    model: aist-87
# END aist-provider

# Brand: replace DeepSeek with AiST (local plugin in ./plugins/aist-brand)
- id: ui-brand-official
  disabled: true
- insert:
    - id: ui-brand-aist
      name: dsh-client-ui-brand-aist
    - id: locale-ru
      name: dsh-client-locale-ru
    - id: ui-settings-aist
      name: dsh-client-ui-settings-aist

# Only AiST: hide DeepSeek providers, the Models page and the Account page
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: ui-settings-models
  disabled: true
- id: ui-settings-account
  disabled: true

# Russian UI by default
- id: locale
  config:
    preference: ru
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
    defaultPreset: danger-full-access
